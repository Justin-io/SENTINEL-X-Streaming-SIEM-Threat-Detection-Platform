[build-system]
requires = ["setuptools>=75,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-x"
version = "0.2.0"
description = "Streaming-compatible lab SIEM and threat detection platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3","PyYAML>=6.0,<7","prometheus-client>=0.20,<1"]

[project.optional-dependencies]
streaming = ["aiokafka>=0.12,<1"]
clickhouse = ["clickhouse-connect>=1.0,<2"]
observability = ["opentelemetry-api>=1.28,<2","opentelemetry-sdk>=1.28,<2","opentelemetry-exporter-otlp-proto-http>=1.28,<2","opentelemetry-instrumentation-fastapi>=0.49b0,<1"]
dev = ["pytest>=8.3,<10","httpx>=0.27,<1","ruff>=0.6,<1"]
all = ["aiokafka>=0.12,<1","clickhouse-connect>=1.0,<2","opentelemetry-api>=1.28,<2","opentelemetry-sdk>=1.28,<2","opentelemetry-exporter-otlp-proto-http>=1.28,<2","opentelemetry-instrumentation-fastapi>=0.49b0,<1"]

[project.scripts]
sentinel-x = "sentinel_x.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel_x*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4","E7","E9","F"]
ignore = ["E701","E702"]

[tool.setuptools.data-files]
"share/sentinel-x/rules" = ["rules/*.yml"]
"share/sentinel-x/rules/sigma" = ["rules/sigma/*.yml"]
